name: Sync shared Sileo catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'sileo/usbkeys/**'
      - 'sileo/sources.json'
      - 'scripts/build_tweaks_repo.py'
      - 'scripts/build_sileo.py'
      - 'scripts/build_usbkeys_sileo.py'
      - 'tests/test_tweaks_repo.py'
      - '.github/workflows/tweaks-catalog.yml'
permissions:
  contents: write
concurrency:
  group: shared-sileo-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check installed-version contract and repository behavior
        run: |
          python3 scripts/check_version_ui.py
          python3 -m unittest discover -s tests -p 'test_tweaks_repo.py' -v
      - name: Refresh public first-party packages
        run: python3 scripts/build_tweaks_repo.py --sync
      - name: Publish indexes and matching packages together
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add sileo/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Sync shared Sileo catalog [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_tweaks_repo.py --sync
          done
          exit 1
