name: Build Daybreak IPA
on:
  push:
    branches: [main]
    paths-ignore: [repo.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daybreak-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Build device IPA
        run: bash scripts/build.sh
      - name: Build on-device XCTest runner
        run: bash scripts/build_runner.sh
      - name: Build Simulator
        run: bash scripts/build.sh simulator
      - name: Launch and inspect in Simulator
        run: python3 scripts/smoke.py
      - name: Compile and run read-only runner API test
        run: |
          device_id=$(xcrun simctl list devices booted --json | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["state"]=="Booted"))')
          xcodebuild test -project Runner/DaybreakRunner.xcodeproj -scheme DaybreakRunner -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath build/runner-simulator -only-testing:DaybreakUITests/DaybreakUITests/testReadOnly CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build/runner-test.log 2>&1 || { tail -150 build/runner-test.log; exit 1; }
      - name: Prepare release and source feed
        run: |
          cp build/device/Payload/Daybreak.app/AppIcon1024.png dist/Daybreak.png
          python3 scripts/feed.py
          shasum -a 256 dist/Daybreak.ipa dist/DaybreakRunner.ipa > dist/SHA256SUMS.txt
      - name: Collect runner build evidence
        if: always()
        run: |
          mkdir -p dist
          for log in build/runner-build.log build/runner-test.log; do
            if [ -f "$log" ]; then cp "$log" dist/; fi
          done
      - name: Upload IPA and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daybreak-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${BUILD_NUMBER}"
          cat > dist/release-notes.md <<'NOTES'
          Experimental on-device Siri runner test. Calendar automation is not implemented yet.

          Install Daybreak.ipa normally. DaybreakRunner.ipa needs DEVELOPMENT signing (free Apple ID is sufficient), including its nested .xctest bundle. A distribution certificate is insufficient. Mount the developer image with your existing on-device developer tool, open Daybreak Runner and approve UI Automation and Notifications. In Daybreak choose a wake time, send the on-device runner test and confirm Apply with Siri inside Daybreak. Verify the exact Sleep | Wake Up entry in Clock, then read/share the runner report.

          CI validates the host IPA and launch, builds the runner, and tests local request delivery, duplicate rejection, session validation and Siri API presence without invoking Siri. CI never changes an alarm. A user report confirms runner startup and local status on iOS 27. Siri execution and the resulting alarm change still require phone verification. See Runner/README.md for requirements.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Daybreak.ipa dist/DaybreakRunner.ipa dist/Daybreak.png dist/repo.json dist/SHA256SUMS.txt dist/simulator-report.txt dist/simulator.png --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest --title "Daybreak ${tag#v} · On-device Siri runner test" --notes-file dist/release-notes.md dist/Daybreak.ipa dist/DaybreakRunner.ipa dist/Daybreak.png dist/repo.json dist/SHA256SUMS.txt dist/simulator-report.txt dist/simulator.png
          fi
      - name: Update sideloader source version
        run: |
          cp dist/repo.json repo.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add repo.json
          git diff --cached --quiet || git commit -m "Update Daybreak source to build ${BUILD_NUMBER}"
          git pull --rebase origin main
          git push origin HEAD:main
